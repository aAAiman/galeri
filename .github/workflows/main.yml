name: Deploy GaleriKita to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update Code and Restart Docker
        run: |
          et -e
          cd /var/www/galeri
          git pull --ff-only origin main
          docker compose up -d --build
          docker image prune -f
